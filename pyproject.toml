[project]
name = "knowledge-assistant-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sofia", email = "addisofia@gmail.com" }
]
requires-python = ">=3.12.6"
dependencies = []

[project.scripts]
knowledge-assistant-rag = "knowledge_assistant_rag:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]